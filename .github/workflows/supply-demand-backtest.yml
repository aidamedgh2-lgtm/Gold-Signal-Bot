name: Supply Demand historical backtest

on:
  push:
    branches:
      - research/supply-demand-backtest
    paths:
      - 'supply_demand_backtest.py'
      - 'supply_demand_live.py'
      - 'tests/**'
      - '.github/workflows/supply-demand-backtest.yml'
  workflow_dispatch:
    inputs:
      outputsize:
        description: "Bars requested per timeframe (free-tier limits apply)"
        required: true
        default: "5000"
        type: choice
        options:
          - "1000"
          - "3000"
          - "5000"
      cost_r:
        description: "Flat estimated transaction cost deducted per trade, in R"
        required: true
        default: "0.05"
        type: choice
        options:
          - "0.00"
          - "0.05"
          - "0.10"

permissions:
  contents: read

concurrency:
  group: supply-demand-backtest
  cancel-in-progress: false

jobs:
  historical-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out isolated research branch
        uses: actions/checkout@v4
        with:
          ref: research/supply-demand-backtest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency-free project requirements
        run: python -m pip install --upgrade pip

      - name: Compile and run offline regression tests
        env:
          TWELVEDATA_API_KEY: offline-test-key
        run: |
          python -m py_compile supply_demand_live.py supply_demand_backtest.py
          python -m unittest discover -s tests -v

      - name: Run historical Supply Demand replay (no Telegram)
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          SD_BACKTEST_OUTPUTSIZE: ${{ inputs.outputsize || '5000' }}
          SD_BACKTEST_COST_R: ${{ inputs.cost_r || '0.05' }}
        run: python supply_demand_backtest.py

      - name: Upload historical research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-demand-historical-backtest
          path: supply_demand_backtest_results/
          if-no-files-found: warn
