name: Hybrid M1 M5 PR validation
on:
  pull_request:
    branches:
      - research/hybrid-validation-base-v2
    paths:
      - 'hybrid_research.py'
      - 'tests/test_hybrid_research.py'
      - 'supply_demand_live.py'
      - 'supply_demand_backtest.py'
      - 'tests/test_supply_demand_backtest.py'
      - '.github/workflows/hybrid-validation-pr.yml'
permissions:
  contents: read
jobs:
  hybrid-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and run offline regression tests only
        env:
          TWELVEDATA_API_KEY: offline-test-key
        run: |
          python -m py_compile supply_demand_live.py supply_demand_backtest.py hybrid_research.py
          python -m unittest discover -s tests -v
