name: Validate bot code

on:
  push:
    branches: [main, "audit/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all project Python files
        run: python -m py_compile bot.py supply_demand_live.py backtest.py forward_test.py

      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
