name: FinzData COMEX context test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m py_compile supply_demand_live.py

      - name: Calculate non-directional COMEX daily context
        env:
          FINZDATA_API_KEY: ${{ secrets.FINZDATA_API_KEY }}
          FINZDATA_CONTEXT_ENABLED: "true"
        run: python -c "from supply_demand_live import comex_daily_context; print(comex_daily_context())"
