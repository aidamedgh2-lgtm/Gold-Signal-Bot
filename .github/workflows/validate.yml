name: Validate bot code

on:
  push:
    branches: [main, repair/pdf-visual-replay-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q bot.py backtest.py backtest services forward_test.py strategy_fidelity.py supply_demand_live.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
