name: PDF strategy visual historical replay

on:
  push:
    branches:
      - validation/golden-case-baseline
      - ai-comprehension-check
  workflow_dispatch:
    inputs:
      replay_days:
        description: "Twelve Data lookback window"
        required: true
        default: "30"
        type: choice
        options: ["7", "14", "30", "60", "90"]
      replay_snapshots:
        description: "Chronological checkpoints"
        required: true
        default: "6"
        type: choice
        options: ["2", "4", "6", "8", "10", "12"]

concurrency:
  group: pdf-visual-replay-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -v
      - name: Run chronological visual replay
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_VISION_MODEL: gemini-3.5-flash-lite
          REPLAY_DAYS: ${{ inputs.replay_days || '30' }}
          REPLAY_SNAPSHOTS: ${{ inputs.replay_snapshots || '6' }}
        run: python -m backtest.visual_replay
      - name: Upload replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: pdf-strategy-visual-replay
          path: visual_replay_results/
          if-no-files-found: error
          retention-days: 30
