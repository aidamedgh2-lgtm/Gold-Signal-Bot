name: Gold signal checks

on:
  workflow_dispatch:
    inputs:
      test_telegram:
        description: 'Send a Telegram TEST message (no trade signal)'
        required: false
        default: false
        type: boolean
      test_goldprice:
        description: 'Test free GoldPrice.dev COMEX daily-volume data only (no trade signal)'
        required: false
        default: false
        type: boolean
      run_backtest:
        description: 'Run historical ICT vs Technical comparison (no Telegram signal)'
        required: false
        default: false
        type: boolean
      backtest_days:
        description: 'Historical window in days (90, 180, 365, or 730)'
        required: false
        default: '365'
        type: choice
        options:
          - '90'
          - '180'
          - '365'
          - '730'
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: gold-signal-check
  cancel-in-progress: false

jobs:
  check-market:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send Telegram connection test
        if: ${{ inputs.test_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          url = f"https://api.telegram.org/bot{token}/sendMessage"
          body = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": "✅ TEST — Gold Signal Bot\nاتصال Telegram يعمل. هذه رسالة اختبار فقط وليست إشارة تداول.",
              "disable_web_page_preview": "true",
          }).encode()
          request = urllib.request.Request(url, data=body, method="POST")
          with urllib.request.urlopen(request, timeout=25) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError(f"Telegram error: {result}")
          print("Telegram test message sent successfully.")
          PY

      - name: Test GoldPrice.dev COMEX daily bars and volume
        if: ${{ inputs.test_goldprice }}
        env:
          GOLDPRICE_API_KEY: ${{ secrets.GOLDPRICE_API_KEY }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.parse
          import urllib.request

          key = os.environ.get("GOLDPRICE_API_KEY", "").strip()
          if not key:
              raise SystemExit("GOLDPRICE_API_KEY is missing in repository Actions secrets.")
          today = dt.datetime.now(dt.timezone.utc).date()
          start = today - dt.timedelta(days=30)
          params = urllib.parse.urlencode({
              "symbol": "XAU-COMEX-MAIN",
              "interval": "1d",
              "from": start.isoformat() + "T00:00:00Z",
              "to": today.isoformat() + "T23:59:59Z",
              "limit": 100,
          })
          req = urllib.request.Request(
              "https://api.goldprice.dev/v1/bars?" + params,
              headers={"Authorization": f"Bearer {key}", "User-Agent": "Gold-Signal-Bot/1.0"},
          )
          with urllib.request.urlopen(req, timeout=25) as response:
              data = json.loads(response.read().decode("utf-8"))
          all_bars = []
          page_count = 0
          next_cursor = None
          while page_count < 10:
              page_params = params
              if next_cursor:
                  page_params += "&" + urllib.parse.urlencode({"cursor": next_cursor})
              page_req = urllib.request.Request(
                  "https://api.goldprice.dev/v1/bars?" + page_params,
                  headers={"Authorization": f"Bearer {key}", "User-Agent": "Gold-Signal-Bot/1.0"},
              )
              with urllib.request.urlopen(page_req, timeout=25) as page_response:
                  page_data = json.loads(page_response.read().decode("utf-8"))
              if page_count == 0:
                  data = page_data
              page_bars = page_data.get("bars") or []
              all_bars.extend(page_bars)
              page_count += 1
              next_cursor = page_data.get("next_cursor")
              print(f"Page {page_count}: {len(page_bars)} bars; has next cursor: {bool(next_cursor)}")
              if not next_cursor:
                  break

          if not all_bars:
              raise SystemExit("API connected, but no COMEX daily bars were returned.")
          volume_rows = [b for b in all_bars if b.get("volume") not in (None, "")]
          print("GoldPrice.dev API: connection successful")
          print("Symbol:", data.get("symbol", "XAU-COMEX-MAIN"))
          print("Interval:", data.get("interval", "1d"))
          print("Pages checked:", page_count)
          print("Bars returned across pages:", len(all_bars))
          print("Source ID:", (data.get("meta") or {}).get("source_id", "not specified"))
          print("Delayed minutes:", data.get("delayed_minutes", "not specified"))
          print("Tier:", (data.get("meta") or {}).get("tier", "not specified"))
          print("Bars with non-empty volume:", len(volume_rows))
          print("Sample bars (newest first):")
          for bar in all_bars[:10]:
              print(json.dumps({
                  "bar_start": bar.get("bar_start"),
                  "is_closed": bar.get("is_closed"),
                  "volume": bar.get("volume"),
                  "open": bar.get("open"),
                  "high": bar.get("high"),
                  "low": bar.get("low"),
                  "close": bar.get("close"),
              }, ensure_ascii=False))
          if not volume_rows:
              raise SystemExit(
                  "No volume found after cursor pagination. This is a data-availability result, "
                  "not proof of an API-key or authentication failure."
              )
          print("DATA CHECK PASSED: futures volume field is present; not yet integrated into signals.")
          PY

      - name: Validate Python syntax
        if: ${{ !inputs.test_telegram }}
        run: python -m py_compile bot.py supply_demand_live.py backtest.py

      - name: Run historical strategy backtest
        if: ${{ inputs.run_backtest && !inputs.test_telegram }}
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          BACKTEST_DAYS: ${{ inputs.backtest_days || '365' }}
        run: python backtest.py

      - name: Upload backtest results
        if: ${{ inputs.run_backtest && !inputs.test_telegram && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gold-strategy-backtest
          path: backtest_results/
          if-no-files-found: warn

      - name: Run signal analysis
        if: ${{ !inputs.test_telegram && !inputs.run_backtest && !inputs.test_goldprice }}
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python supply_demand_live.py

      - name: Save duplicate-prevention state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update last processed signal"
            git push
          fi
