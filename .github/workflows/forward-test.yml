name: Gold legacy ICT forward paper test

on:
  push:
    branches: [main]
    paths:
      - "forward_test.py"
      - ".github/workflows/forward-test.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-forward-paper-test
  cancel-in-progress: false

jobs:
  forward-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out current main code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Load isolated paper-test state
        run: |
          git fetch origin forward-test-data
          if git cat-file -e origin/forward-test-data:forward_test_state_v2.json 2>/dev/null; then
            git show origin/forward-test-data:forward_test_state_v2.json > forward_test_state_v2.json
          fi

      - name: Run current main version of the paper-test code
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python forward_test.py

      - name: Persist only the paper-test state on its isolated branch
        run: |
          if [ ! -f forward_test_state_v2.json ]; then
            echo "Expected forward_test_state_v2.json was not created."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/gold-forward-state"
          cp forward_test_state_v2.json "$RUNNER_TEMP/gold-forward-state/forward_test_state_v2.json"
          rm -f forward_test_state_v2.json
          git fetch origin forward-test-data
          git checkout -B forward-test-data origin/forward-test-data
          cp "$RUNNER_TEMP/gold-forward-state/forward_test_state_v2.json" forward_test_state_v2.json
          git add forward_test_state_v2.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update isolated forward paper test state"
            git push origin HEAD:forward-test-data
          else
            echo "Paper-test state did not change."
          fi
