name: FinzData COMEX context test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m py_compile supply_demand_live.py

      - name: Calculate non-directional COMEX daily context
        env:
          FINZDATA_API_KEY: ${{ secrets.FINZDATA_API_KEY }}
          FINZDATA_CONTEXT_ENABLED: "true"
        run: |
          python - <<'PY'
          from supply_demand_live import comex_daily_context

          result = comex_daily_context()
          print(result)
          if not result.startswith("COMEX GC daily") and not result.startswith("COMEX GC اليومي"):
              raise SystemExit("No usable COMEX daily context was returned.")
          PY
